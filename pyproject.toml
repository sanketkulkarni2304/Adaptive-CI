[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-ci"
version = "0.1.0"
description = "Budget-aware adaptive test selection for CI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = ["scikit-learn>=1.4"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
adaptive-ci = "adaptive_ci.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_ci"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
